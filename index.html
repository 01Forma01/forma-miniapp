<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FORMA Store</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0d0d0f);
      --surface: var(--tg-theme-secondary-bg-color, #16161a);
      --surface-elevated: #1e1e24;
      --text: var(--tg-theme-text-color, #f5f5f7);
      --hint: var(--tg-theme-hint-color, #8e8e98);
      --accent: var(--tg-theme-button-color, #ffffff);
      --accent-text: var(--tg-theme-button-text-color, #0d0d0f);
      --border: rgba(255, 255, 255, 0.08);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 16px 16px 96px;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .orders-btn {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      background: var(--surface-elevated);
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      cursor: pointer;
    }

    .user-badge {
      font-size: 12px;
      color: var(--hint);
      background: var(--surface);
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex: 0 0 auto;
      background: var(--surface);
      color: var(--hint);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .chip.active {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-media {
      position: relative;
      aspect-ratio: 4 / 5;
      background: var(--surface-elevated);
      cursor: pointer;
    }

    .card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(13, 13, 15, 0.85);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .card-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 8px;
    }

    .card-open-area {
      cursor: pointer;
    }

    .card-cat {
      font-size: 11px;
      color: var(--hint);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      margin: 2px 0 0;
    }

    .card-price {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-top: auto;
    }

    .card-price.muted {
      color: var(--hint);
      font-weight: 500;
    }

    .sizes {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .size-btn {
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text);
      cursor: pointer;
    }

    .size-btn.selected {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    .size-btn:disabled {
      opacity: 0.35;
      text-decoration: line-through;
      cursor: not-allowed;
    }

    .btn {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: none;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-text);
    }

    .btn-secondary {
      background: var(--surface-elevated);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-subscribed {
      background: rgba(255, 255, 255, 0.08);
      color: var(--hint);
      border: 1px solid var(--border);
    }

    .cart-bar {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 16px;
      background: var(--accent);
      color: var(--accent-text);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      cursor: pointer;
      z-index: 20;
    }

    .cart-bar.hidden {
      display: none;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      align-items: flex-end;
      z-index: 40;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      background: var(--surface);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 18px 16px 32px;
      border-top: 1px solid var(--border);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 10px;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 800;
      margin: 0;
    }

    .detail-gallery-wrap {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface-elevated);
      margin-bottom: 8px;
    }

    .detail-gallery {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }

    .detail-gallery::-webkit-scrollbar {
      display: none;
    }

    .detail-gallery img {
      flex: 0 0 100%;
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      scroll-snap-align: start;
      display: block;
    }

    .slide-counter {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(13, 13, 15, 0.8);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
    }

    .gallery-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(13, 13, 15, 0.72);
      color: #fff;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .gallery-arrow.prev { left: 10px; }
    .gallery-arrow.next { right: 10px; }

    .dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 14px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--hint);
      opacity: 0.35;
      cursor: pointer;
    }

    .dot.active {
      width: 16px;
      border-radius: 999px;
      opacity: 1;
      background: var(--text);
    }

    .detail-desc {
      margin: 0 0 14px;
      font-size: 13px;
      color: var(--hint);
      line-height: 1.5;
    }

    .size-chart-box {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin: 10px 0 16px;
    }

    .size-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .size-table th,
    .size-table td {
      padding: 6px 4px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    .size-table th {
      color: var(--hint);
      font-weight: 600;
    }

    .size-note {
      margin: 8px 0 0;
      font-size: 11px;
      color: var(--hint);
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .cart-thumb {
      width: 48px;
      height: 60px;
      border-radius: 8px;
      object-fit: cover;
      background: var(--surface-elevated);
      flex-shrink: 0;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qty-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
    }

    .section-block {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .section-label {
      font-size: 13px;
      font-weight: 700;
      margin: 0 0 10px;
    }

    .delivery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .delivery-option {
      padding: 10px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
    }

    .delivery-option.active {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    .delivery-hint {
      font-size: 12px;
      color: var(--hint);
      margin: 0 0 10px;
    }

    .field-input,
    .field-select,
    .comment-input {
      width: 100%;
      margin-bottom: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
    }

    .address-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
      margin-bottom: 10px;
    }

    .address-row .field-input {
      margin-bottom: 0;
      flex: 1;
    }

    .find-btn {
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .mini-map-wrap {
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      margin-bottom: 10px;
    }

    #pvzMap {
      width: 100%;
      height: 220px;
      z-index: 1;
    }

    .mini-map-caption {
      font-size: 11px;
      color: var(--hint);
      padding: 7px 10px;
      background: var(--surface-elevated);
      border-top: 1px solid var(--border);
    }

    .quick-points-label {
      font-size: 11px;
      color: var(--hint);
      margin: 2px 0 6px;
    }

    .quick-points-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }

    .quick-point-btn {
      text-align: left;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
    }

    .quick-point-btn.active {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.14);
      font-weight: 700;
    }

    .pickup-card {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
      font-size: 12px;
    }

    .pickup-card strong {
      display: block;
      margin-bottom: 4px;
    }

    .pickup-card span {
      color: var(--hint);
      display: block;
    }

    .order-card {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .order-id {
      font-size: 14px;
      font-weight: 800;
    }

    .order-status-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-text);
    }

    .order-meta {
      font-size: 12px;
      color: var(--hint);
      margin-bottom: 10px;
      line-height: 1.45;
    }

    .track-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .timeline {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .timeline-step {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      opacity: 0.45;
    }

    .timeline-step.done {
      opacity: 1;
    }

    .step-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-top: 4px;
      background: var(--hint);
      flex-shrink: 0;
    }

    .timeline-step.done .step-dot {
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.14);
    }

    .step-title {
      font-size: 12px;
      font-weight: 700;
    }

    .step-desc {
      font-size: 11px;
      color: var(--hint);
    }

    .toast {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface-elevated);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 60;
      text-align: center;
      max-width: 90%;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>

  <header class="header">
    <div class="brand-title">FORMA STORE</div>
    <div class="header-actions">
      <button id="openOrdersBtn" class="orders-btn">Заказы (0)</button>
      <div id="userBadge" class="user-badge">Гость</div>
    </div>
  </header>

  <div id="filters" class="filters"></div>
  <main id="catalogGrid" class="grid"></main>

  <div id="cartBar" class="cart-bar hidden">
    <span id="cartBarCount">Корзина · 0 шт.</span>
    <span id="cartBarTotal">0 ₽</span>
  </div>

  <div id="productModal" class="modal-backdrop">
    <div id="productModalContent" class="modal"></div>
  </div>

  <div id="cartModal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Корзина и доставка</h2>
        <button id="closeCartBtn" class="size-btn">Закрыть</button>
      </div>

      <div id="cartItems"></div>

      <div class="section-block">
        <div class="section-label">1. Способ получения</div>
        <div id="deliveryMethodsGrid" class="delivery-grid"></div>
        <p id="deliveryHint" class="delivery-hint"></p>

        <div class="section-label" style="margin-top:12px;">2. Данные получателя и адрес</div>
        <input id="recipientNameInput" class="field-input" type="text" placeholder="ФИО получателя (как в паспорте)" />
        <input id="recipientPhoneInput" class="field-input" type="tel" placeholder="Телефон (+7 999 000-00-00)" />

        <div id="courierFieldsWrap">
          <div class="address-row">
            <input id="deliveryDestInput" class="field-input" type="text" placeholder="Адрес или номер ПВЗ (например: Санкт-Петербург, Невский пр., 108)" />
            <button id="findOnMapBtn" type="button" class="find-btn">На карту</button>
          </div>

          <div class="mini-map-wrap">
            <div id="pvzMap"></div>
            <div id="mapStatusCaption" class="mini-map-caption">Нажмите на метку или введите адрес — точка отобразится на карте</div>
          </div>

          <div class="quick-points-label">Готовые точки ПВЗ (нажмите для выбора):</div>
          <div id="quickPointsList" class="quick-points-list"></div>
        </div>

        <div id="pickupFieldsWrap" style="display:none;">
          <select id="pickupPointSelect" class="field-select"></select>
          <div id="pickupPointDetails" class="pickup-card"></div>
        </div>

        <input id="orderComment" class="comment-input" type="text" placeholder="Комментарий к заказу или ориентир (необязательно)" />
      </div>

      <div style="display:flex; justify-content:space-between; font-weight:800; font-size:15px; margin-bottom:14px;">
        <span>Итого</span>
        <span id="modalTotal">0 ₽</span>
      </div>
      <button id="checkoutBtn" class="btn btn-primary">Оформить заказ</button>
    </div>
  </div>

  <div id="ordersModal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Мои заказы и трекинг</h2>
        <button id="closeOrdersBtn" class="size-btn">Закрыть</button>
      </div>
      <div id="ordersList"></div>
    </div>
  </div>

  <script type="module">
    import { MOCK_CATALOG } from "./catalog.mock.js";
    import {
      DELIVERY_METHODS,
      PICKUP_LOCATIONS_BY_METHOD,
      PICKUP_POINTS,
      loadState,
      addToCart,
      updateCartItemQty,
      getCartSummary,
      subscribeToDrop,
      checkoutOrder
    } from "./storeLogic.js";

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    function haptic(type = "light") {
      tg?.HapticFeedback?.impactOccurred?.(type);
    }

    const tgUser = tg?.initDataUnsafe?.user;
    const userBadge = document.getElementById("userBadge");
    if (tgUser) {
      userBadge.textContent = tgUser.username ? `@${tgUser.username}` : tgUser.first_name;
    }

    let { cart, dropSubs, orders } = loadState();
    let activeCategory = "Все";
    const selectedVariants = {};
    let activeProductId = null;
    let activeSlideIndex = 0;
    let selectedDeliveryMethod = DELIVERY_METHODS[0].id;
    let selectedPickupPointId = PICKUP_POINTS[0].id;
    let selectedQuickPointLabel = "";

    let leafletMap = null;
    let markersLayer = null;
    let customAddressMarker = null;
    let geocodeTimer = null;

    MOCK_CATALOG.forEach((product) => {
      const firstInStock = product.variants.find((v) => v.stock > 0) || product.variants[0];
      if (firstInStock) selectedVariants[product.id] = firstInStock.id;
    });

    const toastEl = document.getElementById("toast");
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      setTimeout(() => toastEl.classList.remove("show"), 2300);
    }

    function formatPrice(val) {
      if (typeof val !== "number") return "Цена уточняется";
      return `${val.toLocaleString("ru-RU")} ₽`;
    }

    function updateOrdersButton() {
      const btn = document.getElementById("openOrdersBtn");
      btn.textContent = `Заказы (${orders.length})`;
    }

    function setMapCaption(text) {
      const el = document.getElementById("mapStatusCaption");
      if (el) el.textContent = text;
    }

    function placeCustomAddressMarker(lat, lng, labelText) {
      if (!leafletMap || !window.L) return;
      if (customAddressMarker) {
        markersLayer?.removeLayer(customAddressMarker);
      }
      customAddressMarker = window.L.circleMarker([lat, lng], {
        radius: 10,
        color: "#ffffff",
        weight: 2,
        fillColor: "#ff5a36",
        fillOpacity: 0.95
      });
      customAddressMarker.bindTooltip(labelText, { direction: "top", permanent: false });
      customAddressMarker.addTo(markersLayer);
      leafletMap.setView([lat, lng], 15);
    }

    async function geocodeAddressOnMap(rawAddress) {
      const query = (rawAddress || "").trim();
      if (query.length < 4 || !leafletMap) return;

      const cleanedQuery = query
        .replace(/^(СДЭК|Яндекс Маркет|Почта России)\s*·\s*/i, "")
        .trim();

      setMapCaption("Поиск адреса на карте...");

      try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ru&q=${encodeURIComponent(cleanedQuery)}`;
        const resp = await fetch(url, {
          headers: {
            "Accept": "application/json"
          }
        });
        if (!resp.ok) throw new Error("Geocode response error");
        const results = await resp.json();

        if (Array.isArray(results) && results.length > 0) {
          const lat = parseFloat(results[0].lat);
          const lon = parseFloat(results[0].lon);
          if (!Number.isNaN(lat) && !Number.isNaN(lon)) {
            placeCustomAddressMarker(lat, lon, query);
            setMapCaption(`Найдено: ${results[0].display_name.split(",").slice(0, 3).join(",")}`);
            return;
          }
        }
        setMapCaption("Адрес не найден — проверьте написание или выберите точку ниже");
      } catch (_) {
        setMapCaption("Не удалось загрузить координаты — введите точный адрес вручную");
      }
    }

    function selectPvzPoint(pt, shouldZoom = true) {
      if (!pt) return;
      const destInput = document.getElementById("deliveryDestInput");
      destInput.value = pt.label;
      selectedQuickPointLabel = pt.label;

      if (shouldZoom && leafletMap && typeof pt.lat === "number" && typeof pt.lng === "number") {
        placeCustomAddressMarker(pt.lat, pt.lng, pt.label);
        setMapCaption(`Выбрано: ${pt.label}`);
      }

      renderQuickPoints();
    }

    function ensureMiniMap() {
      if (selectedDeliveryMethod === "pickup" || !window.L) return;
      const mapEl = document.getElementById("pvzMap");
      if (!mapEl) return;

      if (!leafletMap) {
        leafletMap = window.L.map("pvzMap", {
          zoomControl: true,
          attributionControl: false
        }).setView([59.9342, 30.3351], 11);

        // Тайлы с подписями на русском/кириллице (Carto Voyager / OSM)
        window.L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
          maxZoom: 19
        }).addTo(leafletMap);

        markersLayer = window.L.layerGroup().addTo(leafletMap);
      }

      setTimeout(() => {
        leafletMap?.invalidateSize();
      }, 120);

      refreshMapMarkers();
    }

    function refreshMapMarkers() {
      if (!leafletMap || !markersLayer || !window.L) return;
      markersLayer.clearLayers();
      customAddressMarker = null;

      const points = PICKUP_LOCATIONS_BY_METHOD[selectedDeliveryMethod] || [];
      const coords = [];

      points.forEach((pt) => {
        if (typeof pt.lat !== "number" || typeof pt.lng !== "number") return;
        coords.push([pt.lat, pt.lng]);

        const marker = window.L.circleMarker([pt.lat, pt.lng], {
          radius: 9,
          color: "#ffffff",
          weight: 2,
          fillColor: "#2ea6ff",
          fillOpacity: 0.95
        });

        marker.bindTooltip(pt.label, { direction: "top" });
        marker.on("click", () => {
          haptic("light");
          selectPvzPoint(pt, true);
          showToast(`Выбрано: ${pt.label}`);
        });

        marker.addTo(markersLayer);
      });

      const currentAddress = document.getElementById("deliveryDestInput").value.trim();
      if (currentAddress.length >= 4) {
        geocodeAddressOnMap(currentAddress);
      } else if (coords.length > 0) {
        leafletMap.setView(coords[0], 11);
        setMapCaption("Нажмите на метку или введите адрес — точка отобразится на карте");
      }
    }

      const listEl = document.getElementById("quickPointsList");

      listEl.innerHTML = points

          </button>

      listEl.querySelectorAll("[data-pt-idx]").forEach((btn) => {
        btn.onclick = () => {

          showToast("Точка выбрана на карте");

    function renderCatalog() {

      grid.innerHTML = "";

      items.forEach((product) => {

        const sizesHtml = !isComingSoon
          ? `<div class="sizes">

                <button
                  class="size-btn ${v.id === currentVar?.id ? "selected" : ""}"

                  data-vid="${v.id}"
                  ${v.stock <= 0 ? "disabled" : ""}

              `).join("")}

              class="btn ${isSubscribed ? "btn-subscribed" : "btn-secondary"}"

          : `<button
              class="btn btn-primary"
              data-add-id="${product.id}"
              ${!currentVar || currentVar.stock <= 0 ? "disabled" : ""}
            >В корзину</button>`;

        card.innerHTML = `
          <div class="card-media" data-open-id="${product.id}">
            <img src="${product.images[0]}" alt="${product.title}" loading="lazy" />

          </div>
          <div class="card-body">
            <div class="card-open-area" data-open-id="${product.id}">
              <div class="card-cat">${product.category}</div>
              <h3 class="card-title">${product.title}</h3>
            </div>
            ${sizesHtml}
            <div class="card-price ${isComingSoon ? "muted" : ""}">
              ${isComingSoon ? "Скоро дроп" : formatPrice(currentVar?.price)}
            </div>
            ${actionHtml}
          </div>
        `;

        card.querySelectorAll("[data-open-id]").forEach((el) => {
          el.onclick = () => openProductModal(product.id);
        });

        card.querySelectorAll(".size-btn[data-vid]").forEach((btn) => {
          btn.onclick = () => {
            haptic("light");
            selectedVariants[product.id] = btn.dataset.vid;
            renderCatalog();
          };
        });

        const addBtn = card.querySelector("[data-add-id]");
        if (addBtn) {
          addBtn.onclick = () => {
            const res = addToCart(cart, product, currentVar);
            if (res.error) {
              showToast(res.error);
            } else {
              haptic("medium");
              cart = res.cart;
              renderCartBar();
              showToast(`Добавлено: ${product.title} (${currentVar.size})`);
            }
          };
        }

        const dropBtn = card.querySelector("[data-drop-id]");
        if (dropBtn) {
          dropBtn.onclick = () => {
            haptic("medium");
            const res = subscribeToDrop(dropSubs, product);
            dropSubs = res.dropSubs;
            renderCatalog();
            showToast(
              res.alreadySubscribed
                ? "Вы уже подписаны на этот дроп"
                : `Уведомим о дропе: ${product.title}`
            );
          };
        }

        grid.appendChild(card);
      });

    const productModal = document.getElementById("productModal");
    const productModalContent = document.getElementById("productModalContent");

    function openProductModal(productId) {
      haptic("light");
      activeProductId = productId;
      activeSlideIndex = 0;
      renderProductModal();
      productModal.classList.add("open");
    }

    function closeProductModal() {
      productModal.classList.remove("open");
      activeProductId = null;
    }

    productModal.onclick = (e) => {
      if (e.target === productModal) closeProductModal();
    };

    function updateGalleryIndicators(total) {
      const counter = document.getElementById("detailCounter");
      if (counter) counter.textContent = `${activeSlideIndex + 1} / ${total}`;
      document.querySelectorAll("#detailDots .dot").forEach((dot, i) => {
        dot.classList.toggle("active", i === activeSlideIndex);
      });
    }

    function goToDetailSlide(index, total) {
      haptic("light");
      activeSlideIndex = (index + total) % total;
      const gallery = document.getElementById("detailGallery");
      if (gallery) {
        gallery.scrollTo({
          left: activeSlideIndex * gallery.clientWidth,
          behavior: "smooth"
        });
      }
      updateGalleryIndicators(total);
    }

    function renderProductModal() {
      const product = MOCK_CATALOG.find((p) => p.id === activeProductId);
      if (!product) return;

      const isComingSoon = product.status === "coming_soon";
      const currentVar = product.variants.find((v) => v.id === selectedVariants[product.id]) || product.variants[0];
      const isSubscribed = dropSubs.includes(product.id);
      const totalSlides = product.images.length;
      const hasManySlides = totalSlides > 1;

      const chartHtml = product.sizeChart
        ? `<div class="size-chart-box">
            <div style="font-size:12px; font-weight:700; margin-bottom:6px;">Размерная сетка (см)</div>
            <table class="size-table">
              <thead>
                <tr>${product.sizeChart.headers.map((h) => `<th>${h}</th>`).join("")}</tr>
              </thead>
              <tbody>
                ${product.sizeChart.rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}
              </tbody>
            </table>
            ${product.sizeChart.note ? `<p class="size-note">${product.sizeChart.note}</p>` : ""}
          </div>`
        : "";

      const sizesHtml = !isComingSoon
        ? `<div style="margin-bottom:10px;">
            <div style="font-size:12px; color:var(--hint); margin-bottom:6px;">
              Размер: <strong style="color:var(--text);">${currentVar?.size || "-"}</strong>
            </div>
            <div class="sizes">
              ${product.variants.map((v) => `
                <button
                  class="size-btn ${v.id === currentVar?.id ? "selected" : ""}"
                  data-modal-vid="${v.id}"
                  ${v.stock <= 0 ? "disabled" : ""}
                >${v.size}</button>
              `).join("")}
            </div>
          </div>`
        : "";

      const actionHtml = isComingSoon
        ? `<button
            class="btn ${isSubscribed ? "btn-subscribed" : "btn-secondary"}"
            id="modalDropBtn"
          >${isSubscribed ? "Вы в списке на дроп" : "Уведомить о дропе"}</button>`
        : `<button
            class="btn btn-primary"
            id="modalAddBtn"
            ${!currentVar || currentVar.stock <= 0 ? "disabled" : ""}
          >В корзину · ${formatPrice(currentVar?.price)}</button>`;

      productModalContent.innerHTML = `
        <div class="modal-header">
          <h2 class="modal-title">${product.title}</h2>
          <button id="closeProductBtn" class="size-btn">Закрыть</button>
        </div>

        <div class="detail-gallery-wrap">
          <div id="detailGallery" class="detail-gallery">
            ${product.images.map((src) => `<img src="${src}" alt="${product.title}" />`).join("")}
          </div>
          ${hasManySlides ? `<div id="detailCounter" class="slide-counter">1 / ${totalSlides}</div>` : ""}
          ${hasManySlides ? `
            <button class="gallery-arrow prev" id="prevSlideBtn" aria-label="Назад">‹</button>
            <button class="gallery-arrow next" id="nextSlideBtn" aria-label="Вперёд">›</button>
          ` : ""}
        </div>

        <div class="dots" id="detailDots">
          ${product.images.map((_, i) => `<span class="dot ${i === 0 ? "active" : ""}" data-dot="${i}"></span>`).join("")}
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <span class="card-cat">${product.category}</span>
          <span class="card-price ${isComingSoon ? "muted" : ""}" style="margin:0;">
            ${isComingSoon ? (product.dropLabel || "Скоро дроп") : formatPrice(currentVar?.price)}
          </span>
        </div>

        <p class="detail-desc">${product.description || ""}</p>
        ${sizesHtml}
        ${chartHtml}
        ${actionHtml}
      `;

      document.getElementById("closeProductBtn").onclick = closeProductModal;

      const galleryEl = document.getElementById("detailGallery");
      if (galleryEl && hasManySlides) {
        galleryEl.onscroll = () => {
          if (!galleryEl.clientWidth) return;
          const idx = Math.round(galleryEl.scrollLeft / galleryEl.clientWidth);
          if (idx !== activeSlideIndex && idx >= 0 && idx < totalSlides) {
            activeSlideIndex = idx;
            updateGalleryIndicators(totalSlides);
          }
        };
        document.getElementById("prevSlideBtn").onclick = () => goToDetailSlide(activeSlideIndex - 1, totalSlides);
        document.getElementById("nextSlideBtn").onclick = () => goToDetailSlide(activeSlideIndex + 1, totalSlides);
        document.querySelectorAll("#detailDots .dot").forEach((dot) => {
          dot.onclick = () => goToDetailSlide(Number(dot.dataset.dot), totalSlides);
        });
      }

      productModalContent.querySelectorAll("[data-modal-vid]").forEach((btn) => {
        btn.onclick = () => {
          haptic("light");
          selectedVariants[product.id] = btn.dataset.modalVid;
          renderCatalog();
          renderProductModal();
        };
      });

      const modalAddBtn = document.getElementById("modalAddBtn");
      if (modalAddBtn) {
        modalAddBtn.onclick = () => {
          const res = addToCart(cart, product, currentVar);
          if (res.error) {
            showToast(res.error);
          } else {
            haptic("medium");
            cart = res.cart;
            renderCartBar();
            showToast(`Добавлено: ${product.title} (${currentVar.size})`);
          }
        };
      }

      const modalDropBtn = document.getElementById("modalDropBtn");
      if (modalDropBtn) {
        modalDropBtn.onclick = () => {
          haptic("medium");
          const res = subscribeToDrop(dropSubs, product);
          dropSubs = res.dropSubs;
          renderCatalog();
          renderProductModal();
          showToast(
            res.alreadySubscribed
              ? "Вы уже подписаны на этот дроп"
              : `Уведомим о дропе: ${product.title}`
          );
        };
      }
    }

      const courierWrap = document.getElementById("courierFieldsWrap");
      const pickupWrap = document.getElementById("pickupFieldsWrap");
      const destInput = document.getElementById("deliveryDestInput");

      grid.innerHTML = DELIVERY_METHODS.map((m) => `
        <button
          type="button"
          class="delivery-option ${m.id === selectedDeliveryMethod ? "active" : ""}"
          data-method="${m.id}"
        >${m.label}</button>
      `).join("");

      const activeMeta = DELIVERY_METHODS.find((m) => m.id === selectedDeliveryMethod) || DELIVERY_METHODS[0];
      hintEl.textContent = activeMeta.hint;

      if (selectedDeliveryMethod === "pickup") {
        courierWrap.style.display = "none";

        courierWrap.style.display = "block";
        pickupWrap.style.display = "none";

          destInput.placeholder = "Индекс, город, улица, дом, кв. (или отделение Почты)";
        } else if (selectedDeliveryMethod === "yandex") {
          destInput.placeholder = "Адрес или номер ПВЗ Яндекс Маркета";
        } else {
          destInput.placeholder = "Адрес или номер ПВЗ СДЭК";
        }
        renderQuickPoints();
        ensureMiniMap();

      grid.querySelectorAll("[data-method]").forEach((btn) => {
        btn.onclick = () => {

      if (itemsCount === 0) {
        cartBar.classList.add("hidden");

      }
      cartBar.classList.remove("hidden");
      document.getElementById("cartBarCount").textContent = `Корзина · ${itemsCount} шт.`;
      document.getElementById("cartBarTotal").textContent = formatPrice(totalPrice);

              <div style="font-weight:700; font-size:14px;">${item.title}</div>

      document.getElementById("orderComment").value = "";
      cartModal.classList.remove("open");
      renderCartBar();
      updateOrdersButton();
      showToast(`Заказ ${res.order.id} оформлен`);

      renderOrdersModal();
      ordersModal.classList.add("open");
    };

    renderFilters();
    renderCatalog();
    renderCartBar();
    updateOrdersButton();
  </script>
</body>
</html>
