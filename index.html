<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FORMA Store</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0d0d0f);
      --surface: var(--tg-theme-secondary-bg-color, #16161a);
      --surface-elevated: #1e1e24;
      --text: var(--tg-theme-text-color, #f5f5f7);
      --hint: var(--tg-theme-hint-color, #8e8e98);
      --accent: var(--tg-theme-button-color, #ffffff);
      --accent-text: var(--tg-theme-button-text-color, #0d0d0f);
      --border: rgba(255, 255, 255, 0.08);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 16px 16px 96px;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .user-badge {
      font-size: 12px;
      color: var(--hint);
      background: var(--surface);
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex: 0 0 auto;
      background: var(--surface);
      color: var(--hint);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .chip.active {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-media {
      position: relative;
      aspect-ratio: 4 / 5;
      background: var(--surface-elevated);
    }

    .card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(13, 13, 15, 0.85);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .card-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 8px;
    }

    .card-cat {
      font-size: 11px;
      color: var(--hint);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      margin: 0;
    }

    .card-price {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-top: auto;
    }

    .card-price.muted {
      color: var(--hint);
      font-weight: 500;
    }

    .sizes {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .size-btn {
      padding: 5px 8px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text);
      cursor: pointer;
    }

    .size-btn.selected {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    .size-btn:disabled {
      opacity: 0.35;
      text-decoration: line-through;
      cursor: not-allowed;
    }

    .btn {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--accent-text);
    }

    .btn-secondary {
      background: var(--surface-elevated);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-subscribed {
      background: rgba(255, 255, 255, 0.08);
      color: var(--hint);
      border: 1px solid var(--border);
    }

    .cart-bar {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 16px;
      background: var(--accent);
      color: var(--accent-text);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      cursor: pointer;
      z-index: 20;
    }

    .cart-bar.hidden {
      display: none;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: flex-end;
      z-index: 40;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-height: 82vh;
      overflow-y: auto;
      background: var(--surface);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 20px 16px 28px;
      border-top: 1px solid var(--border);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 800;
      margin: 0;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qty-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
    }

    .comment-input {
      width: 100%;
      margin-top: 14px;
      margin-bottom: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text);
      font-size: 13px;
    }

    .toast {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface-elevated);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 60;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>

  <header class="header">
    <div class="brand-title">FORMA STORE</div>
    <div id="userBadge" class="user-badge">Гость</div>
  </header>

  <div id="filters" class="filters"></div>
  <main id="catalogGrid" class="grid"></main>

  <div id="cartBar" class="cart-bar hidden">
    <span id="cartBarCount">Корзина · 0 шт.</span>
    <span id="cartBarTotal">0 ₽</span>
  </div>

  <div id="cartModal" class="modal-backdrop">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Корзина</h2>
        <button id="closeCartBtn" class="size-btn">Закрыть</button>
      </div>
      <div id="cartItems"></div>
      <input id="orderComment" class="comment-input" type="text" placeholder="Комментарий к заказу (необязательно)" />
      <div style="display:flex; justify-content:space-between; font-weight:800; font-size:15px; margin-bottom:14px;">
        <span>Итого</span>
        <span id="modalTotal">0 ₽</span>
      </div>
      <button id="checkoutBtn" class="btn btn-primary">Оформить заказ</button>
    </div>
  </div>

  <script type="module">
    import { MOCK_CATALOG } from "./catalog.mock.js";
    import {
      loadState,
      saveCart,
      addToCart,
      getCartSummary,
      subscribeToDrop,
      checkoutOrder
    } from "./storeLogic.js";

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const tgUser = tg?.initDataUnsafe?.user;
    const userBadge = document.getElementById("userBadge");
    if (tgUser) {
      userBadge.textContent = tgUser.username ? `@${tgUser.username}` : tgUser.first_name;
    }

    let { cart, dropSubs } = loadState();
    let activeCategory = "Все";
    const selectedVariants = {};

    MOCK_CATALOG.forEach((product) => {
      const firstInStock = product.variants.find((v) => v.stock > 0) || product.variants[0];
      if (firstInStock) selectedVariants[product.id] = firstInStock.id;
    });

    const toastEl = document.getElementById("toast");
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      setTimeout(() => toastEl.classList.remove("show"), 2000);
    }

    function formatPrice(val) {
      if (typeof val !== "number") return "Цена уточняется";
      return `${val.toLocaleString("ru-RU")} ₽`;
    }

    function renderFilters() {
      const categories = ["Все", ...new Set(MOCK_CATALOG.map((p) => p.category))];
      const filtersEl = document.getElementById("filters");
      filtersEl.innerHTML = "";

      categories.forEach((cat) => {
        const btn = document.createElement("button");
        btn.className = `chip ${cat === activeCategory ? "active" : ""}`;
        btn.textContent = cat;
        btn.onclick = () => {
          activeCategory = cat;
          renderFilters();
          renderCatalog();
        };
        filtersEl.appendChild(btn);
      });
    }

    function renderCatalog() {
      const grid = document.getElementById("catalogGrid");
      grid.innerHTML = "";

      const items = activeCategory === "Все"
        ? MOCK_CATALOG
        : MOCK_CATALOG.filter((p) => p.category === activeCategory);

      items.forEach((product) => {
        const card = document.createElement("article");
        card.className = "card";

        const isComingSoon = product.status === "coming_soon";
        const currentVar = product.variants.find((v) => v.id === selectedVariants[product.id]) || product.variants[0];
        const isSubscribed = dropSubs.includes(product.id);

        const sizesHtml = !isComingSoon
          ? `<div class="sizes">
              ${product.variants.map((v) => `
                <button
                  class="size-btn ${v.id === currentVar?.id ? "selected" : ""}"
                  data-pid="${product.id}"
                  data-vid="${v.id}"
                  ${v.stock <= 0 ? "disabled" : ""}
                >${v.size}</button>
              `).join("")}
            </div>`
          : "";

        const actionHtml = isComingSoon
          ? `<button
              class="btn ${isSubscribed ? "btn-subscribed" : "btn-secondary"}"
              data-drop-id="${product.id}"
            >${isSubscribed ? "Вы в списке на дроп" : "Уведомить о дропе"}</button>`
          : `<button
              class="btn btn-primary"
              data-add-id="${product.id}"
              ${!currentVar || currentVar.stock <= 0 ? "disabled" : ""}
            >В корзину</button>`;

        card.innerHTML = `
          <div class="card-media">
            <img src="${product.images[0]}" alt="${product.title}" loading="lazy" />
            ${isComingSoon ? `<span class="badge">${product.dropLabel || "Скоро дроп"}</span>` : ""}
          </div>
          <div class="card-body">
            <div class="card-cat">${product.category}</div>
            <h3 class="card-title">${product.title}</h3>
            ${sizesHtml}
            <div class="card-price ${isComingSoon ? "muted" : ""}">
              ${isComingSoon ? "Скоро дроп" : formatPrice(currentVar?.price)}
            </div>
            ${actionHtml}
          </div>
        `;

        card.querySelectorAll(".size-btn[data-vid]").forEach((btn) => {
          btn.onclick = () => {
            selectedVariants[product.id] = btn.dataset.vid;
            renderCatalog();
          };
        });

        const addBtn = card.querySelector("[data-add-id]");
        if (addBtn) {
          addBtn.onclick = () => {
            const res = addToCart(cart, product, currentVar);
            if (res.error) {
              showToast(res.error);
            } else {
              cart = res.cart;
              renderCartBar();
              showToast(`Добавлено: ${product.title} (${currentVar.size})`);
            }
          };
        }

        const dropBtn = card.querySelector("[data-drop-id]");
        if (dropBtn) {
          dropBtn.onclick = () => {
            const res = subscribeToDrop(dropSubs, product);
            dropSubs = res.dropSubs;
            renderCatalog();
            showToast(
              res.alreadySubscribed
                ? "Вы уже подписаны на этот дроп"
                : `Уведомим о дропе: ${product.title}`
            );
          };
        }

        grid.appendChild(card);
      });
    }

    function renderCartBar() {
      const { itemsCount, totalPrice } = getCartSummary(cart);
      const cartBar = document.getElementById("cartBar");
      if (itemsCount === 0) {
        cartBar.classList.add("hidden");
        return;
      }
      cartBar.classList.remove("hidden");
      document.getElementById("cartBarCount").textContent = `Корзина · ${itemsCount} шт.`;
      document.getElementById("cartBarTotal").textContent = formatPrice(totalPrice);
    }

    function renderCartModal() {
      const listEl = document.getElementById("cartItems");
      const { totalPrice } = getCartSummary(cart);
      document.getElementById("modalTotal").textContent = formatPrice(totalPrice);

      if (!cart.length) {
        listEl.innerHTML = `<p style="color:var(--hint); font-size:13px;">Корзина пуста</p>`;
        return;
      }

      listEl.innerHTML = cart.map((item, idx) => `
        <div class="cart-item">
          <div>
            <div style="font-weight:700; font-size:14px;">${item.title}</div>
            <div style="color:var(--hint); font-size:12px;">Размер: ${item.size} · ${formatPrice(item.price)}</div>
          </div>
          <div class="qty-controls">
            <button class="qty-btn" data-dec="${idx}">-</button>
            <span style="font-weight:700; min-width:16px; text-align:center;">${item.qty}</span>
            <button class="qty-btn" data-inc="${idx}">+</button>
          </div>
        </div>
      `).join("");

      listEl.querySelectorAll("[data-dec]").forEach((btn) => {
        btn.onclick = () => {
          const i = Number(btn.dataset.dec);
          if (cart[i].qty > 1) cart[i].qty -= 1;
          else cart.splice(i, 1);
          saveCart(cart);
          renderCartBar();
          renderCartModal();
        };
      });

      listEl.querySelectorAll("[data-inc]").forEach((btn) => {
        btn.onclick = () => {
          const i = Number(btn.dataset.inc);
          if (cart[i].qty < cart[i].maxStock) {
            cart[i].qty += 1;
            saveCart(cart);
            renderCartBar();
            renderCartModal();
          } else {
            showToast("Больше нет в наличии");
          }
        };
      });
    }

    const modal = document.getElementById("cartModal");
    document.getElementById("cartBar").onclick = () => {
      renderCartModal();
      modal.classList.add("open");
    };
    document.getElementById("closeCartBtn").onclick = () => modal.classList.remove("open");
    modal.onclick = (e) => {
      if (e.target === modal) modal.classList.remove("open");
    };

    document.getElementById("checkoutBtn").onclick = () => {
      const comment = document.getElementById("orderComment").value.trim();
      const res = checkoutOrder(cart, comment);
      if (!res.ok) {
        showToast(res.error);
        return;
      }
      cart = [];
      document.getElementById("orderComment").value = "";
      modal.classList.remove("open");
      renderCartBar();
      showToast("Заказ отправлен в бот");
    };

    renderFilters();
    renderCatalog();
    renderCartBar();
  </script>
</body>
</html>
